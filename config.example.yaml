dbPath: ./data/stella.db
# Directory where uploaded card images are stored.
imagePath: ./data/images
# IANA timezone (e.g. Europe/Madrid) used for review-day boundaries and sent
# to sync devices so their clocks show local time, DST included.
# Empty = the host's local timezone.
timezone: ""
server:
  port: 8858
  appName: Stella
  bodyLimit: 10485760
auth:
  # false (default) = single-user mode: no login, everything belongs to one
  # built-in local account.
  # true = multi-user mode: OIDC login required; every user gets their own
  # decks, cards, and review history. Requires the oidc settings below.
  enabled: false
  # External base URL(s) this Stella instance is reachable at — usually just
  # one, but list more (e.g. a LAN address and a public domain) if you reach
  # it multiple ways. Register <publicURL>/auth/callback as a redirect URI at
  # the OIDC provider for each one. Also used as Stella's own OAuth issuer
  # identity for MCP clients (Stella is its own Authorization Server for
  # /mcp, layered on top of this OIDC login) — requests are matched to one of
  # these by Host header, falling back to the first entry.
  publicURLs: []
  # publicURLs:
  #   - https://stella.example.com
  #   - http://192.168.1.50:8858
  oidc:
    # Issuer URL of your OpenID Connect provider (Keycloak, Authentik, Pocket
    # ID, etc.); its discovery document must live at
    # <issuer>/.well-known/openid-configuration.
    issuer: ""
    clientID: ""
    clientSecret: ""
    # If true, Stella registers itself with the provider via a self-hosted
    # Client ID Metadata Document (<publicURL>/auth/client-metadata.json)
    # instead of clientID/clientSecret above — no manually created client
    # record needed, just allowlist that URL at the provider for each entry
    # in publicURLs above (each is a distinct client identity under CIMD).
    # Only supported by providers implementing CIMD (e.g. Pocket ID). Mutually
    # exclusive with clientID/clientSecret.
    cimd: false
mcp:
  # Enable the MCP endpoint at /mcp (StreamableHTTP transport).
  enabled: false
  # How many days an OAuth refresh token issued to an MCP client stays valid
  # (multi-user mode only) before the client must reconnect through the
  # consent screen. 0 or unset = 30.
  refreshTokenDays: 30
logger:
  level: info   # debug | info | warn | error
  format: ""    # logfmt (default) | text | json
review:
  # Hour (0-23) at which a new study day begins.
  dayStartsAt: 3
  # How many not-yet-retained cards to juggle at once.
  nonMemorisedCardsInHand: 10
  # Cap on the scheduled interval in days; 0 = no cap.
  maxScheduledIntervalDays: 0
  # Shuffle due cards instead of ordering by interval.
  randomiseScheduledCards: false
  # Shuffle the order unseen cards are introduced.
  randomiseNewCards: false
cards:
  # Automatically play audio when a card (front or back) is shown.
  autoplayAudio: true
