dbPath: ./data/stella.db
# Directory where uploaded card images are stored.
imagePath: ./data/images
server:
  port: 8858
  appName: Stella
  bodyLimit: 10485760
auth:
  # true = no login; everything belongs to one built-in local user.
  # false = multi-user mode: OIDC login is required and every user gets their
  # own decks, cards, and review history. Requires the oidc settings below.
  singleUser: true
  oidc:
    # Issuer URL of your OpenID Connect provider (Keycloak, Authentik, etc.);
    # its discovery document must live at <issuer>/.well-known/openid-configuration.
    issuer: ""
    clientID: ""
    clientSecret: ""
    # External base URL of this Stella instance. Register
    # <publicURL>/auth/callback as the redirect URI at the provider.
    publicURL: ""
mcp:
  # Enable the MCP endpoint at /mcp (StreamableHTTP transport).
  enabled: false
logger:
  level: info
  debug: false
review:
  # Hour (0-23) at which a new study day begins.
  dayStartsAt: 3
  # How many not-yet-retained cards to juggle at once.
  nonMemorisedCardsInHand: 10
  # Cap on the scheduled interval in days; 0 = no cap.
  maxScheduledIntervalDays: 0
  # Shuffle due cards instead of ordering by interval.
  randomiseScheduledCards: false
  # Shuffle the order unseen cards are introduced.
  randomiseNewCards: false
cards:
  # Automatically play audio when a card (front or back) is shown.
  autoplayAudio: true
