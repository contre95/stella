---
name: Development Build

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dev-build.yaml
      - Containerfile
      - src/**
      - views/**
      - styles/**
      - public/**
      - tailwind.config.js
      - go.mod
      - go.sum
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dev-build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU for cross-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Codeberg registry
        run: |
          echo "${{ secrets.CODEBERG_TOKEN }}" | \
            docker login codeberg.org -u "${{ secrets.CODEBERG_USER }}" --password-stdin

      - name: Build and push dev image
        run: |
          commit_sha=$(git rev-parse --short HEAD)
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file Containerfile \
            --build-arg IMAGE_TAG=dev-$commit_sha \
            --tag codeberg.org/monopieza/stella:dev \
            --push \
            .
