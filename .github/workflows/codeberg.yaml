---
name: Build and Push to Codeberg Registry

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/codeberg.yaml
      - Containerfile
      - src/**
      - views/**
      - go.mod
      - go.sum
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone the repository
        uses: actions/checkout@v4

      - name: Set up QEMU for cross-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Codeberg registry
        run: |
          echo "${{ secrets.CODEBERG_TOKEN }}" | \
            docker login codeberg.org -u "${{ secrets.CODEBERG_USER }}" --password-stdin

      - name: Build and push multi-arch image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file Containerfile \
            --tag codeberg.org/monopieza/stella:dev \
            --push \
            .
