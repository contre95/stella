---
name: Tag, Release, and Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      custom_version:
        description: 'Custom version (optional, overrides version_type)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  detect-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      bump: ${{ steps.check.outputs.bump }}
    steps:
      - name: Check for a version marker in the commit message
        id: check
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_MESSAGE" == *"[MAJOR]"* ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "bump=major" >> "$GITHUB_OUTPUT"
          elif [[ "$COMMIT_MESSAGE" == *"[MINOR]"* ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "bump=minor" >> "$GITHUB_OUTPUT"
          elif [[ "$COMMIT_MESSAGE" == *"[PATCH]"* ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "bump=patch" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "bump=none" >> "$GITHUB_OUTPUT"
          fi

  tag-and-release:
    needs: detect-release
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.detect-release.outputs.should_release == 'true')
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.set_tag.outputs.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get the latest tag
        id: get_tag
        run: |
          git fetch --tags
          latest_tag=$(git describe --tags --match "v*.*.*" --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $latest_tag"
          echo "tag=$latest_tag" >> $GITHUB_ENV

      - name: Determine new version
        id: determine_version
        env:
          BUMP: ${{ needs.detect-release.outputs.bump }}
        run: |
          version=${tag#v}
          IFS='.' read -r major minor patch <<< "$version"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ -n "${{ github.event.inputs.custom_version }}" ]]; then
              new_version="${{ github.event.inputs.custom_version }}"
              if [[ ! $new_version =~ ^v ]]; then
                new_version="v$new_version"
              fi
            else
              case "${{ github.event.inputs.version_type }}" in
                patch)
                  patch=$((patch + 1))
                  ;;
                minor)
                  minor=$((minor + 1))
                  patch=0
                  ;;
                major)
                  major=$((major + 1))
                  minor=0
                  patch=0
                  ;;
              esac
              new_version="v${major}.${minor}.${patch}"
            fi
          else
            case "$BUMP" in
              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
              minor)
                minor=$((minor + 1))
                patch=0
                ;;
              patch)
                patch=$((patch + 1))
                ;;
            esac
            new_version="v${major}.${minor}.${patch}"
          fi

          echo "New version: $new_version"
          echo "new_version=$new_version" >> $GITHUB_ENV

      - name: Create Git tag
        run: |
          git tag ${{ env.new_version }}
          git push origin ${{ env.new_version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.new_version }}
          name: Release ${{ env.new_version }}
          draft: false
          prerelease: false

      - name: Output tag name
        id: set_tag
        run: |
          echo "tag_name=${{ env.new_version }}" >> $GITHUB_OUTPUT

  build-and-push:
    needs: tag-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag-and-release.outputs.tag_name }}
          fetch-depth: 0

      - name: Set up QEMU for cross-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Codeberg registry
        run: |
          echo "${{ secrets.CODEBERG_TOKEN }}" | \
            docker login codeberg.org -u "${{ secrets.CODEBERG_USER }}" --password-stdin

      - name: Build and push versioned image
        run: |
          version=${{ needs.tag-and-release.outputs.tag_name }}
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file Containerfile \
            --build-arg IMAGE_TAG=$version \
            --tag codeberg.org/monopieza/stella:$version \
            --push \
            .

      # IMAGE_TAG is only consumed by the final runtime stage, so this reuses
      # the builder's layer cache from the step above and only redoes that stage.
      - name: Build and push beta image
        run: |
          version=${{ needs.tag-and-release.outputs.tag_name }}
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file Containerfile \
            --build-arg IMAGE_TAG=beta-$version \
            --tag codeberg.org/monopieza/stella:beta \
            --push \
            .
