---
name: Tag, Release, and Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      custom_version:
        description: 'Custom version (optional, overrides version_type)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine new version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSION_TYPE: ${{ github.event.inputs.version_type }}
          CUSTOM_VERSION: ${{ github.event.inputs.custom_version }}
        run: |
          git fetch --tags --force
          latest_tag=$(git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          echo "Latest tag: ${latest_tag:-none}"

          version=${latest_tag:-v0.0.0}
          IFS='.' read -r major minor patch <<< "${version#v}"

          bump() {
            case "$1" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
          }

          release=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            release=true
            bump "$VERSION_TYPE"
          else
            range=${latest_tag:+$latest_tag..}HEAD
            while IFS= read -r -d '' message; do
              case "$message" in
                *"[MAJOR]"*) bump major ;;
                *"[MINOR]"*) bump minor ;;
                *"[PATCH]"*) bump patch ;;
                *) continue ;;
              esac
              echo "Bump from: $(head -n2 <<< "$message" | tr -d '\n')"
              release=true
            done < <(git log --first-parent --reverse --format='%B%x00' "$range")
          fi

          new_version="v${major}.${minor}.${patch}"
          if [[ -n "$CUSTOM_VERSION" ]]; then
            new_version="v${CUSTOM_VERSION#v}"
          fi

          echo "New version: $new_version (release: $release)"
          if [[ "$release" == "true" ]]; then
            echo "tag_name=$new_version" >> "$GITHUB_OUTPUT"
          fi

      - name: Push tag to Codeberg and GitHub
        if: steps.version.outputs.tag_name != ''
        env:
          TAG: ${{ steps.version.outputs.tag_name }}
          CODEBERG_USER: ${{ secrets.CODEBERG_USER }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          git tag "$TAG"
          # Codeberg's push mirror force-syncs refs to GitHub, deleting any tag that doesn't exist on Codeberg.
          git push "https://${CODEBERG_USER}:${CODEBERG_TOKEN}@codeberg.org/monopieza/Stella.git" "refs/tags/$TAG"
          git push origin "refs/tags/$TAG"

      - name: Create GitHub Release
        if: steps.version.outputs.tag_name != ''
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: Release ${{ steps.version.outputs.tag_name }}
          draft: false
          prerelease: false

  build-and-push:
    needs: tag-and-release
    if: needs.tag-and-release.outputs.tag_name != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag-and-release.outputs.tag_name }}
          fetch-depth: 0

      - name: Set up QEMU for cross-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Codeberg registry
        run: |
          echo "${{ secrets.CODEBERG_TOKEN }}" | \
            docker login codeberg.org -u "${{ secrets.CODEBERG_USER }}" --password-stdin

      - name: Build and push versioned image
        run: |
          version=${{ needs.tag-and-release.outputs.tag_name }}
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file Containerfile \
            --build-arg IMAGE_TAG=$version \
            --tag codeberg.org/monopieza/stella:$version \
            --push \
            .

      # IMAGE_TAG is only consumed by the final runtime stage, so this reuses
      # the builder's layer cache from the step above and only redoes that stage.
      - name: Build and push beta image
        run: |
          version=${{ needs.tag-and-release.outputs.tag_name }}
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file Containerfile \
            --build-arg IMAGE_TAG=beta-$version \
            --tag codeberg.org/monopieza/stella:beta \
            --push \
            .
