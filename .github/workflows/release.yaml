---
name: Tag, Release, and Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      custom_version:
        description: 'Custom version (optional, overrides version_type)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  tag-and-release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(join(github.event.commits.*.message, ' '), '[MAJOR]') ||
      contains(join(github.event.commits.*.message, ' '), '[MINOR]') ||
      contains(join(github.event.commits.*.message, ' '), '[PATCH]')
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine new version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          VERSION_TYPE: ${{ github.event.inputs.version_type }}
          CUSTOM_VERSION: ${{ github.event.inputs.custom_version }}
        run: |
          git fetch --tags --force
          latest_tag=$(git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          echo "Latest tag: ${latest_tag:-none}"

          bump() {
            case "$1" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
          }

          version=${latest_tag:-v0.0.0}
          IFS='.' read -r major minor patch <<< "${version#v}"

          if [[ -n "$latest_tag" ]]; then
            range="$latest_tag..HEAD"
          # Without a tag only this push counts. before is all zeros for a new branch and missing after a force push.
          elif git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            range="$BEFORE_SHA..HEAD"
          else
            range="HEAD^!"
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            bump "$VERSION_TYPE"
          else
            while IFS= read -r -d '' message; do
              case "$message" in
                *"[MAJOR]"*) bump major ;;
                *"[MINOR]"*) bump minor ;;
                *"[PATCH]"*) bump patch ;;
                *) continue ;;
              esac
              echo "Bump from: $(head -n2 <<< "$message" | tr -d '\n')"
            done < <(git log --first-parent --reverse --format='%B%x00' "$range")
          fi
          new_version="v${major}.${minor}.${patch}"

          if [[ -n "$CUSTOM_VERSION" ]]; then
            new_version="v${CUSTOM_VERSION#v}"
          fi

          # Markers only on commits inside a merged PR aren't counted; the merge commit title needs one.
          if [[ "$new_version" == "$version" ]]; then
            echo "::error::No version marker found on main's own commits in $range"
            exit 1
          fi

          echo "New version: $new_version"
          echo "tag_name=$new_version" >> "$GITHUB_OUTPUT"

      - name: Push tag
        env:
          TAG: ${{ steps.version.outputs.tag_name }}
        run: |
          git tag "$TAG"
          git push origin "refs/tags/$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: Release ${{ steps.version.outputs.tag_name }}
          draft: false
          prerelease: false

  build-and-push:
    needs: tag-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag-and-release.outputs.tag_name }}
          fetch-depth: 0

      - name: Set up QEMU for cross-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Codeberg registry
        env:
          CODEBERG_USER: ${{ secrets.CODEBERG_USER }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          user=${CODEBERG_USER//[[:space:]]/}
          token=${CODEBERG_TOKEN//[[:space:]]/}
          for attempt in 1 2 3 4 5; do
            if docker login codeberg.org -u "$user" --password-stdin <<< "$token"; then
              exit 0
            fi
            echo "Login attempt $attempt failed, retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Build and push versioned image
        run: |
          version=${{ needs.tag-and-release.outputs.tag_name }}
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file Containerfile \
            --build-arg IMAGE_TAG=$version \
            --tag codeberg.org/monopieza/stella:$version \
            --push \
            .

      # IMAGE_TAG is only consumed by the final runtime stage, so this reuses
      # the builder's layer cache from the step above and only redoes that stage.
      - name: Build and push beta image
        run: |
          version=${{ needs.tag-and-release.outputs.tag_name }}
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file Containerfile \
            --build-arg IMAGE_TAG=beta-$version \
            --tag codeberg.org/monopieza/stella:beta \
            --push \
            .
