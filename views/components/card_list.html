{{if .Facts}}
  <div class="overflow-hidden rounded-2xl border border-gray-100 shadow-sm dark:border-gray-800">
    <table class="min-w-full divide-y divide-gray-200 text-sm dark:divide-gray-800">
      <thead class="bg-gray-50 dark:bg-gray-900/50">
        <tr class="text-left text-xs font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400">
          <th class="px-4 py-3">Front</th>
          <th class="px-4 py-3">Back</th>
          <th class="px-4 py-3">Cards</th>
          <th class="px-4 py-3"></th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100 bg-white dark:divide-gray-800 dark:bg-gray-950">
        {{range .Facts}}
          <tr>
            <td class="px-4 py-3 font-medium text-gray-900 dark:text-gray-100">{{.Fact.Front}}</td>
            <td class="px-4 py-3 text-gray-600 dark:text-gray-300">{{.Fact.Back}}</td>
            <td class="px-4 py-3">
              <div class="flex flex-wrap gap-1.5">
                {{range .Cards}}
                  <span class="inline-flex items-center gap-1 rounded-full bg-gray-100 px-2.5 py-0.5 text-xs font-medium text-gray-700 dark:bg-gray-800 dark:text-gray-200">
                    {{.Card.View}} · {{.Status}}
                  </span>
                {{end}}
              </div>
            </td>
            <td class="px-4 py-3 text-right">
              <button
                hx-delete="/cards/{{.Fact.ID}}"
                hx-target="#card-list"
                hx-swap="innerHTML"
                hx-confirm="Delete this fact and its cards?"
                class="rounded-lg px-2.5 py-1 text-xs font-medium text-red-600 hover:bg-red-50 dark:text-red-400 dark:hover:bg-red-950/40"
              >
                Delete
              </button>
            </td>
          </tr>
        {{end}}
      </tbody>
    </table>
  </div>
{{else}}
  <div class="rounded-2xl border border-dashed border-gray-200 p-8 text-center text-sm text-gray-500 dark:border-gray-700 dark:text-gray-400">
    No cards yet. Add one above to get started.
  </div>
{{end}}
