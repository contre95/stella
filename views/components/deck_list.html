{{if .Decks}}
  <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
    {{range .Decks}}
      <div class="deck-card rounded-xl border border-gray-200 bg-white p-4 transition dark:border-gray-700 dark:bg-[#141414]">
        <div class="flex items-start justify-between gap-3">
          <div
            class="cursor-pointer flex-1 hover:text-pink-600 dark:hover:text-pink-400 transition-colors"
            hx-get="/decks/{{.ID}}/facts"
            hx-target="#deck-facts"
            hx-swap="innerHTML"
            hx-push-url="false"
            _="on click add .ring-2 .ring-pink-500 to closest .deck-card then remove .ring-2 .ring-pink-500 from .deck-card:not(closest .deck-card)"
          >
            <p class="font-semibold text-gray-900 dark:text-gray-100">{{.Name}}</p>
            <p class="mt-1 text-xs text-gray-400 dark:text-gray-500">{{.ID}}</p>
          </div>
          <div class="flex shrink-0 items-center gap-2">
            <a
              href="/review?decks={{.ID}}"
              hx-get="/review?decks={{.ID}}"
              hx-target="#contenido"
              hx-swap="innerHTML"
              hx-push-url="true"
              class="rounded-lg bg-pink-600 px-3 py-1.5 text-xs font-semibold text-white shadow-sm hover:bg-pink-500 transition-colors"
            >Review</a>
            <button
              hx-delete="/decks/{{.ID}}"
              hx-target="#deck-list"
              hx-swap="innerHTML"
              hx-trigger="confirmed"
              onclick="(function(btn) {
                Swal.fire({
                  title: 'Delete deck?',
                  text: 'This will permanently delete the deck and all its cards.',
                  icon: 'warning',
                  showCancelButton: true,
                  confirmButtonColor: '#db2777',
                  cancelButtonColor: '#6b7280',
                  confirmButtonText: 'Yes, delete it',
                  cancelButtonText: 'Cancel',
                  background: document.documentElement.classList.contains('dark') ? '#111827' : '#ffffff',
                  color: document.documentElement.classList.contains('dark') ? '#f9fafb' : '#111827'
                }).then(function(result) {
                  if (result.isConfirmed) htmx.trigger(btn, 'confirmed');
                });
              })(this)"
              class="rounded-lg p-1.5 text-gray-400 hover:bg-red-50 hover:text-red-600 transition-colors dark:hover:bg-red-950/30 dark:hover:text-red-400"
              aria-label="Delete deck"
            >
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    {{end}}
  </div>
  <div id="deck-facts" class="mt-5"></div>
{{else}}
  <div class="rounded-xl border border-dashed border-gray-300 bg-white p-10 text-center dark:border-gray-700 dark:bg-[#141414]">
    <p class="text-sm text-gray-500 dark:text-gray-400">No decks yet. Create one above.</p>
  </div>
{{end}}
