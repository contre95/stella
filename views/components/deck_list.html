{{if .Decks}}
  <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
    {{range .Decks}}
      <a
        href="/decks/{{.ID}}"
        hx-get="/decks/{{.ID}}"
        hx-target="#contenido"
        hx-swap="outerHTML"
        hx-push-url="true"
        class="deck-card glass lift rounded-2xl p-4 hover:shadow-lg transition-all hover:scale-105"
        style="box-shadow:none"
      >
        <div class="flex items-start justify-between gap-3 h-full">
          <div class="flex-1 min-w-0">
            <p class="font-semibold break-words text-gray-900 dark:text-gray-100">{{.TruncatedName}}</p>
            {{if .Description}}
              <p class="mt-0.5 text-xs text-gray-400 dark:text-gray-500 line-clamp-1">{{.Description}}</p>
            {{end}}
          </div>
          <div class="flex shrink-0 items-center gap-2 absolute top-4 right-4">
            <button
              type="button"
              hx-get="/review?decks={{.ID}}"
              hx-target="#contenido"
              hx-swap="outerHTML"
              hx-push-url="true"
              onclick="event.stopPropagation()"
              class="btn-primary rounded-lg px-2.5 py-1 text-xs font-semibold"
            >Study</button>
            <a
              href="/decks/{{.ID}}/export"
              onclick="event.stopPropagation()"
              class="rounded-lg p-1.5 text-gray-400 hover:bg-white/60 hover:text-gray-700 transition-colors dark:hover:bg-white/10 dark:hover:text-gray-200"
              title="Export JSON"
            >
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
              </svg>
            </a>
            <button
              type="button"
              hx-delete="/decks/{{.ID}}"
              hx-target="#deck-list"
              hx-swap="innerHTML"
              hx-trigger="confirmed"
              onclick="event.stopPropagation(); (function(btn) {
                swalGlass.fire({
                  title: 'Delete deck?',
                  text: 'This will permanently delete the deck and all its cards.',
                  icon: 'warning',
                  showCancelButton: true,
                  confirmButtonText: 'Yes, delete it',
                  cancelButtonText: 'Cancel',
                }).then(function(result) {
                  if (result.isConfirmed) htmx.trigger(btn, 'confirmed');
                });
              })(this)"
              class="rounded-lg p-1.5 text-gray-400 hover:bg-red-500/10 hover:text-red-600 transition-colors dark:hover:text-red-400"
              title="Delete deck"
            >
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
            </button>
          </div>
        </div>
      </a>
    {{end}}
  </div>
{{else}}
  <div class="glass rounded-2xl border-dashed p-10 text-center">
    <p class="text-sm text-gray-500 dark:text-gray-400">No decks yet. Create one above.</p>
  </div>
{{end}}
