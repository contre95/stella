<form
  hx-post="/decks/{{.DeckID}}/cards"
  hx-target="#deck-facts"
  hx-swap="innerHTML"
  hx-encoding="multipart/form-data"
  _="on htmx:afterRequest call me.reset()"
  class="glass mb-4 rounded-2xl p-5"
>
  <div class="grid gap-4 sm:grid-cols-2">
    <label class="block">
      <span class="text-xs font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400">Front</span>
      <input
        name="front"
        required
        placeholder="Question / prompt"
        class="glass-input mt-1.5 w-full rounded-xl px-3 py-2 text-sm"
      />
    </label>
    <label class="block">
      <span class="text-xs font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400">Back</span>
      <input
        name="back"
        placeholder="Answer"
        class="glass-input mt-1.5 w-full rounded-xl px-3 py-2 text-sm"
      />
    </label>
    <label class="block">
      <span class="text-xs font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400">Front image <span class="font-normal normal-case">(optional)</span></span>
      <input
        type="file"
        name="image_front"
        accept=".jpg,.jpeg,.png,.gif,.webp"
        class="glass-input mt-1.5 w-full rounded-xl px-3 py-1.5 text-sm file:mr-3 file:rounded-lg file:border-0 file:bg-pink-500/15 file:px-3 file:py-1 file:text-xs file:font-semibold file:text-pink-700 hover:file:bg-pink-500/25 dark:file:text-pink-300"
      />
    </label>
    <label class="block">
      <span class="text-xs font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400">Back image <span class="font-normal normal-case">(optional)</span></span>
      <input
        type="file"
        name="image_back"
        accept=".jpg,.jpeg,.png,.gif,.webp"
        class="glass-input mt-1.5 w-full rounded-xl px-3 py-1.5 text-sm file:mr-3 file:rounded-lg file:border-0 file:bg-pink-500/15 file:px-3 file:py-1 file:text-xs file:font-semibold file:text-pink-700 hover:file:bg-pink-500/25 dark:file:text-pink-300"
      />
    </label>
  </div>
  <div class="mt-4 flex items-center justify-between">
    <label class="flex items-center gap-2">
      <input
        type="checkbox"
        name="reverse"
        class="h-4 w-4 rounded border-gray-300 text-pink-600 focus:ring-pink-500 dark:border-gray-600"
      />
      <span class="text-sm text-gray-600 dark:text-gray-300">Also add reverse card</span>
    </label>
    <button
      type="submit"
      class="btn-primary rounded-xl px-4 py-2 text-sm font-semibold"
    >
      Add card
    </button>
  </div>
</form>

{{if .Facts}}
  <div class="glass overflow-hidden rounded-2xl">
    <table class="min-w-full divide-y divide-gray-200/60 text-sm dark:divide-white/10">
      <thead class="bg-white/40 dark:bg-white/[0.03]">
        <tr class="text-left text-xs font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400">
          <th class="px-4 py-3">Front</th>
          <th class="hidden px-4 py-3 sm:table-cell">Back</th>
          <th class="px-4 py-3">Status</th>
          <th class="px-4 py-3"></th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100/70 dark:divide-white/[0.06]">
        {{range .Facts}}
          <tr class="align-top hover:bg-white/50 dark:hover:bg-white/[0.04] transition-colors">
            <td class="px-4 py-3 font-medium text-gray-900 dark:text-gray-100 max-w-[8rem] sm:max-w-xs">
              {{if .Fact.ImageFront}}
                <img src="/images/{{.Fact.ImageFront}}" alt="" class="mb-1.5 h-16 w-full rounded-lg object-cover" />
              {{end}}
              <span class="line-clamp-2 break-words">{{.Fact.Front}}</span>
            </td>
            <td class="hidden px-4 py-3 text-gray-500 dark:text-gray-400 sm:table-cell max-w-xs">
              {{if .Fact.ImageBack}}
                <img src="/images/{{.Fact.ImageBack}}" alt="" class="mb-1.5 h-16 w-full rounded-lg object-cover" />
              {{end}}
              <span class="line-clamp-2 break-words">{{.Fact.Back}}</span>
            </td>
            <td class="px-4 py-3">
              <div class="flex flex-col gap-1">
                {{range .Cards}}
                  <span class="inline-flex items-center gap-1 self-start rounded-full px-2.5 py-0.5 text-xs font-medium ring-1 ring-inset
                    {{if eq .Status "unseen"}}bg-gray-500/10 text-gray-500 ring-gray-500/20 dark:text-gray-400
                    {{else if eq .Status "learning"}}bg-amber-500/15 text-amber-600 ring-amber-500/20 dark:text-amber-400
                    {{else}}bg-pink-500/15 text-pink-600 ring-pink-500/20 dark:text-pink-400{{end}}">
                    {{if eq .Card.View "forward"}}→{{else}}←{{end}} {{.Status}}
                  </span>
                {{end}}
              </div>
            </td>
            <td class="px-3 py-2 text-right">
              <button
                hx-delete="/cards/{{.Fact.ID}}"
                hx-target="closest tr"
                hx-swap="outerHTML"
                hx-confirm="Delete this fact and its cards?"
                class="rounded-lg p-2 text-gray-400 hover:bg-red-500/10 hover:text-red-600 transition-colors dark:hover:text-red-400"
                style="min-width: 44px; min-height: 44px;"
                aria-label="Delete"
              >
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
              </button>
            </td>
          </tr>
        {{end}}
      </tbody>
    </table>
  </div>
{{else}}
  <div class="glass rounded-2xl border-dashed p-10 text-center">
    <p class="text-sm text-gray-500 dark:text-gray-400">No cards in this deck yet.</p>
  </div>
{{end}}
