<form
  hx-post="/decks/{{.DeckID}}/cards"
  hx-target="#deck-facts"
  hx-swap="innerHTML"
  hx-encoding="multipart/form-data"
  _="on htmx:afterRequest call me.reset()"
  class="mb-4 rounded-xl border border-gray-200 bg-white p-5 dark:border-gray-700 dark:bg-[#141414]"
>
  <div class="grid gap-4 sm:grid-cols-2">
    <label class="block">
      <span class="text-xs font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400">Front</span>
      <input
        name="front"
        required
        placeholder="Question / prompt"
        class="mt-1.5 w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 placeholder-gray-400 transition dark:border-gray-600 dark:bg-gray-800 dark:text-gray-100 dark:placeholder-gray-500"
      />
    </label>
    <label class="block">
      <span class="text-xs font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400">Back</span>
      <input
        name="back"
        placeholder="Answer"
        class="mt-1.5 w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 placeholder-gray-400 transition dark:border-gray-600 dark:bg-gray-800 dark:text-gray-100 dark:placeholder-gray-500"
      />
    </label>
    <label class="block sm:col-span-2">
      <span class="text-xs font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400">Image <span class="font-normal normal-case">(optional — jpg, png, gif, webp)</span></span>
      <input
        type="file"
        name="image"
        accept=".jpg,.jpeg,.png,.gif,.webp"
        class="mt-1.5 w-full rounded-lg border border-gray-300 bg-white px-3 py-1.5 text-sm text-gray-900 transition file:mr-3 file:rounded file:border-0 file:bg-pink-50 file:px-3 file:py-1 file:text-xs file:font-semibold file:text-pink-700 hover:file:bg-pink-100 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-100 dark:file:bg-pink-950/40 dark:file:text-pink-400"
      />
    </label>
  </div>
  <div class="mt-4 flex items-center justify-between">
    <label class="flex items-center gap-2">
      <input
        type="checkbox"
        name="reverse"
        class="h-4 w-4 rounded border-gray-300 text-pink-600 dark:border-gray-600"
      />
      <span class="text-sm text-gray-600 dark:text-gray-300">Also add reverse card</span>
    </label>
    <button
      type="submit"
      class="rounded-lg bg-pink-600 px-4 py-2 text-sm font-semibold text-white hover:bg-pink-500 transition-colors"
    >
      Add card
    </button>
  </div>
</form>

{{if .Facts}}
  <div class="overflow-hidden rounded-xl border border-gray-200 dark:border-gray-700">
    <table class="min-w-full divide-y divide-gray-200 text-sm dark:divide-gray-700">
      <thead class="bg-gray-50 dark:bg-gray-800">
        <tr class="text-left text-xs font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400">
          <th class="px-4 py-3">Front</th>
          <th class="hidden px-4 py-3 sm:table-cell">Back</th>
          <th class="px-4 py-3">Status</th>
          <th class="px-4 py-3"></th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100 bg-white dark:divide-gray-700 dark:bg-[#141414]">
        {{range .Facts}}
          <tr class="align-top hover:bg-gray-50 dark:hover:bg-gray-800/50 transition-colors">
            <td class="px-4 py-3 font-medium text-gray-900 dark:text-gray-100 max-w-[8rem] sm:max-w-xs">
              {{if .Fact.Image}}
                <img src="/images/{{.Fact.Image}}" alt="" class="mb-1.5 h-16 w-full rounded object-cover" />
              {{end}}
              <span class="line-clamp-2 break-words">{{.Fact.Front}}</span>
            </td>
            <td class="hidden px-4 py-3 text-gray-500 dark:text-gray-400 sm:table-cell max-w-xs">
              <span class="line-clamp-2 break-words">{{.Fact.Back}}</span>
            </td>
            <td class="px-4 py-3">
              <div class="flex flex-col gap-1">
                {{range .Cards}}
                  <span class="inline-flex items-center gap-1 self-start rounded-full px-2.5 py-0.5 text-xs font-medium
                    {{if eq .Status "unseen"}}bg-gray-100 text-gray-500 dark:bg-gray-700 dark:text-gray-400
                    {{else if eq .Status "learning"}}bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-400
                    {{else}}bg-pink-100 text-pink-700 dark:bg-pink-900/30 dark:text-pink-400{{end}}">
                    {{if eq .Card.View "forward"}}→{{else}}←{{end}} {{.Status}}
                  </span>
                {{end}}
              </div>
            </td>
            <td class="px-3 py-2 text-right">
              <button
                hx-delete="/cards/{{.Fact.ID}}"
                hx-target="closest tr"
                hx-swap="outerHTML"
                hx-confirm="Delete this fact and its cards?"
                class="rounded-lg p-2 text-gray-400 hover:bg-red-50 hover:text-red-600 transition-colors dark:hover:bg-red-950/30 dark:hover:text-red-400"
                style="min-width: 44px; min-height: 44px;"
                aria-label="Delete"
              >
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
              </button>
            </td>
          </tr>
        {{end}}
      </tbody>
    </table>
  </div>
{{else}}
  <div class="rounded-xl border border-dashed border-gray-300 bg-white p-10 text-center dark:border-gray-700 dark:bg-[#141414]">
    <p class="text-sm text-gray-500 dark:text-gray-400">No cards in this deck yet.</p>
  </div>
{{end}}
