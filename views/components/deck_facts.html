<details class="add-card-panel glass mb-5 rounded-2xl">
  <summary class="flex cursor-pointer select-none list-none items-center gap-2.5 rounded-2xl px-5 py-3.5 text-sm font-semibold text-gray-700 transition-colors hover:text-pink-600 dark:text-gray-200 dark:hover:text-pink-400">
    <svg class="add-card-plus h-4 w-4 shrink-0 text-pink-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
    </svg>
    Add card
  </summary>
  <form
    hx-post="/decks/{{.DeckID}}/cards"
    hx-target="#deck-card-grid"
    hx-swap="innerHTML"
    hx-encoding="multipart/form-data"
    _="on htmx:afterRequest call me.reset()"
    class="border-t border-gray-200/60 px-5 pb-5 pt-4 dark:border-white/10"
  >
    <div class="grid gap-4 sm:grid-cols-2">
      <label class="block">
        <span class="text-xs font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400">Front</span>
        <input
          name="front"
          required
          placeholder="Question / prompt"
          class="glass-input mt-1.5 w-full rounded-xl px-3 py-2 text-sm"
        />
      </label>
      <label class="block">
        <span class="text-xs font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400">Back</span>
        <input
          name="back"
          placeholder="Answer"
          class="glass-input mt-1.5 w-full rounded-xl px-3 py-2 text-sm"
        />
      </label>
      <label class="block">
        <span class="text-xs font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400">Front image <span class="font-normal normal-case">(optional)</span></span>
        <input
          type="file"
          name="image_front"
          accept=".jpg,.jpeg,.png,.gif,.webp"
          class="glass-input mt-1.5 w-full rounded-xl px-3 py-1.5 text-sm file:mr-3 file:rounded-lg file:border-0 file:bg-pink-500/15 file:px-3 file:py-1 file:text-xs file:font-semibold file:text-pink-700 hover:file:bg-pink-500/25 dark:file:text-pink-300"
        />
      </label>
      <label class="block">
        <span class="text-xs font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400">Back image <span class="font-normal normal-case">(optional)</span></span>
        <input
          type="file"
          name="image_back"
          accept=".jpg,.jpeg,.png,.gif,.webp"
          class="glass-input mt-1.5 w-full rounded-xl px-3 py-1.5 text-sm file:mr-3 file:rounded-lg file:border-0 file:bg-pink-500/15 file:px-3 file:py-1 file:text-xs file:font-semibold file:text-pink-700 hover:file:bg-pink-500/25 dark:file:text-pink-300"
        />
      </label>
      <div class="block">
        <span class="text-xs font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400">Front audio <span class="font-normal normal-case">(optional)</span></span>
        <div class="audio-rec-widget" data-for="audio_front">
          <input
            type="file"
            name="audio_front"
            accept=".mp3,.ogg,.wav,.m4a,.webm,.aac,.flac"
            class="glass-input mt-1.5 w-full rounded-xl px-3 py-1.5 text-sm file:mr-3 file:rounded-lg file:border-0 file:bg-pink-500/15 file:px-3 file:py-1 file:text-xs file:font-semibold file:text-pink-700 hover:file:bg-pink-500/25 dark:file:text-pink-300"
          />
          <div class="rec-ui"></div>
        </div>
      </div>
      <div class="block">
        <span class="text-xs font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400">Back audio <span class="font-normal normal-case">(optional)</span></span>
        <div class="audio-rec-widget" data-for="audio_back">
          <input
            type="file"
            name="audio_back"
            accept=".mp3,.ogg,.wav,.m4a,.webm,.aac,.flac"
            class="glass-input mt-1.5 w-full rounded-xl px-3 py-1.5 text-sm file:mr-3 file:rounded-lg file:border-0 file:bg-pink-500/15 file:px-3 file:py-1 file:text-xs file:font-semibold file:text-pink-700 hover:file:bg-pink-500/25 dark:file:text-pink-300"
          />
          <div class="rec-ui"></div>
        </div>
      </div>
    </div>
    <div class="mt-4 flex items-center justify-between">
      <label class="flex items-center gap-2">
        <input
          type="checkbox"
          name="reverse"
          class="h-4 w-4 rounded border-gray-300 text-pink-600 focus:ring-pink-500 dark:border-gray-600"
        />
        <span class="text-sm text-gray-600 dark:text-gray-300">Also add reverse card</span>
      </label>
      <button
        type="submit"
        class="btn-primary rounded-xl px-4 py-2 text-sm font-semibold"
      >
        Add card
      </button>
    </div>
  </form>
</details>

<div id="deck-card-grid">{{template "components/deck_card_grid" .}}</div>

<style>
  .add-card-panel summary::-webkit-details-marker { display: none; }
  .add-card-plus { transition: transform 0.2s ease; }
  .add-card-panel[open] .add-card-plus { transform: rotate(45deg); }
  @media (prefers-reduced-motion: reduce) {
    .add-card-plus { transition: none; }
  }
</style>
