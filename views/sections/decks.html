<div>
  <div class="mb-6">
    <h1 class="text-xl font-bold text-gray-900 dark:text-white">Decks</h1>
    <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Organise your cards into named decks.</p>
  </div>

  <form
    hx-post="/decks"
    hx-target="#deck-list"
    hx-swap="innerHTML"
    _="on htmx:afterRequest call me.reset()"
    class="flex gap-3 rounded-xl border border-gray-200 bg-white p-4 dark:border-gray-700 dark:bg-[#141414]"
  >
    <input
      name="name"
      required
      placeholder="Deck name"
      class="min-w-0 flex-1 rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 placeholder-gray-400 transition dark:border-gray-600 dark:bg-gray-800 dark:text-gray-100 dark:placeholder-gray-500"
    />
    <button
      type="submit"
      class="shrink-0 rounded-lg bg-pink-600 px-4 py-2 text-sm font-semibold text-white hover:bg-pink-500 transition-colors"
    >
      Create deck
    </button>
  </form>

  <div id="deck-list" hx-get="/decks/list" hx-trigger="load" class="mt-5"></div>
</div>
