<div id="contenido">
  <div class="mb-6">
    <a
      href="/decks"
      hx-get="/decks"
      hx-target="#contenido"
      hx-swap="outerHTML"
      hx-push-url="true"
      class="inline-flex items-center gap-1 text-sm text-gray-400 hover:text-pink-600 transition-colors dark:hover:text-pink-400"
    >
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
      </svg>
      Decks
    </a>

    <div class="mt-3 flex flex-wrap items-center justify-between gap-4">
      <div>
        <span id="group-name-view" class="flex items-center gap-1.5">
          <h1 class="text-2xl font-bold tracking-tight text-gray-900 dark:text-white">{{.Group.Name}}</h1>
          <button
            type="button"
            _="on click add .hidden to #group-name-view then remove .hidden from #group-name-edit then call #group-name-input.focus()"
            class="rounded p-1 text-gray-400 hover:text-pink-600 transition-colors dark:hover:text-pink-400"
            title="Rename group"
          >
            {{template "icon-edit" (dict "Class" "h-3.5 w-3.5")}}
          </button>
        </span>
        <form
          id="group-name-edit"
          hx-put="/groups/{{.Group.ID}}?source=group_page"
          hx-target="#contenido"
          hx-swap="outerHTML"
          class="{{if not .RenameErrors}}hidden {{end}}flex flex-col gap-1"
        >
          <div class="flex items-center gap-1.5">
            <input
              id="group-name-input"
              name="name"
              value="{{.RenameValue}}"
              maxlength="32"
              class="{{errClass .RenameErrors "name" "glass-input rounded-lg px-2 py-0.5 text-2xl font-bold w-48 text-gray-900 dark:text-white"}}"
            />
            <button type="submit" class="rounded p-1 text-gray-400 hover:text-green-600 transition-colors dark:hover:text-green-400" title="Save">
              {{template "icon-check" (dict "Class" "h-4 w-4" "Stroke" "2.5")}}
            </button>
            <button
              type="button"
              _="on click add .hidden to #group-name-edit then remove .hidden from #group-name-view"
              class="rounded p-1 text-gray-400 hover:text-red-500 transition-colors dark:hover:text-red-400"
              title="Cancel"
            >
              {{template "icon-close" (dict "Class" "h-4 w-4" "Stroke" "2.5")}}
            </button>
          </div>
          {{if index .RenameErrors "name"}}<p class="text-xs text-red-600 dark:text-red-400">{{index .RenameErrors "name"}}</p>{{end}}
        </form>
        <p class="mt-0.5 text-sm text-gray-500 dark:text-gray-400">{{len .Decks}} deck{{if ne (len .Decks) 1}}s{{end}}</p>
      </div>

      <div class="flex items-center gap-2">
        <a
          href="/groups/{{.Group.ID}}/export"
          class="rounded-lg p-2 text-gray-400 hover:bg-white/60 hover:text-gray-700 transition-colors dark:hover:bg-white/10 dark:hover:text-gray-200"
          title="Export group as zip"
        >
          {{template "icon-export" (dict "Class" "h-4 w-4")}}
        </a>
        <button
          hx-delete="/groups/{{.Group.ID}}"
          hx-swap="none"
          hx-confirm="Delete group '{{.Group.Name}}'? Decks will become ungrouped."
          _="on htmx:afterRequest(detail) if detail.successful go to url '/decks'"
          class="rounded-lg p-2 text-gray-400 hover:bg-red-500/10 hover:text-red-600 transition-colors dark:hover:text-red-400"
          title="Delete group"
        >
          {{template "icon-trash" (dict "Class" "h-4 w-4")}}
        </button>
      </div>
    </div>
  </div>

  <div id="deck-list">{{template "components/group_deck_grid" .}}</div>
</div>
