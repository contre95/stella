<div id="contenido">
  <div class="mb-6">
    <a
      href="/decks"
      hx-get="/decks"
      hx-target="#contenido"
      hx-swap="outerHTML"
      hx-push-url="true"
      class="inline-flex items-center gap-1 text-sm text-gray-400 hover:text-pink-600 transition-colors dark:hover:text-pink-400"
    >
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
      </svg>
      Decks
    </a>

    <div class="mt-3 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-4">
        <form
          hx-post="/decks/{{.Deck.ID}}/image"
          hx-target="#contenido"
          hx-swap="outerHTML"
          hx-encoding="multipart/form-data"
          class="shrink-0"
        >
          <label class="group relative block cursor-pointer" title="{{if .Deck.Image}}Change deck picture{{else}}Add deck picture{{end}}">
            {{if .Deck.Image}}
              <img
                src="/images/{{.Deck.Image}}"
                alt=""
                class="h-16 w-12 rounded-xl object-cover"
                style="box-shadow:0 6px 16px -6px {{.Deck.Color}}88; transform:rotate(-4deg);"
              />
            {{else}}
              <div
                class="flex h-16 w-12 items-center justify-center rounded-xl text-xl font-bold text-white"
                style="background:linear-gradient(135deg,{{.Deck.Color}},{{.Deck.Color}}cc); box-shadow:0 6px 16px -6px {{.Deck.Color}}88; transform:rotate(-4deg);"
                aria-hidden="true"
              >{{printf "%.1s" .Deck.Name}}</div>
            {{end}}
            <span class="pointer-events-none absolute inset-0 flex items-center justify-center rounded-xl bg-black/40 opacity-0 transition-opacity group-hover:opacity-100" style="transform:rotate(-4deg);">
              <svg class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0z" />
              </svg>
            </span>
            <input
              type="file"
              name="image"
              accept=".jpg,.jpeg,.png,.gif,.webp"
              class="hidden"
              onchange="this.form.requestSubmit()"
            />
            <span class="sr-only">{{if .Deck.Image}}Change deck picture{{else}}Add deck picture{{end}}</span>
          </label>
        </form>
        <div>
          <h1 class="text-2xl font-bold tracking-tight text-gray-900 dark:text-white">{{.Deck.Name}}</h1>
          <p class="mt-0.5 text-sm text-gray-500 dark:text-gray-400">
            {{len .Facts}} card{{if ne (len .Facts) 1}}s{{end}}{{if .Deck.Description}} · {{.Deck.Description}}{{end}}
          </p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        {{if .Facts}}
          <a
            href="/review?decks={{.Deck.ID}}"
            hx-get="/review?decks={{.Deck.ID}}"
            hx-target="#contenido"
            hx-swap="outerHTML"
            hx-push-url="true"
            class="btn-primary rounded-xl px-4 py-2 text-sm font-semibold"
          >Study</a>
        {{end}}
        <a
          href="/decks/{{.Deck.ID}}/export"
          class="rounded-lg p-2 text-gray-400 hover:bg-white/60 hover:text-gray-700 transition-colors dark:hover:bg-white/10 dark:hover:text-gray-200"
          title="Export JSON"
        >
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
          </svg>
        </a>
        <button
          hx-delete="/decks/{{.Deck.ID}}"
          hx-swap="none"
          hx-confirm="This will permanently delete the deck and all its cards."
          _="on htmx:afterRequest(detail) if detail.successful go to url '/decks'"
          class="rounded-lg p-2 text-gray-400 hover:bg-red-500/10 hover:text-red-600 transition-colors dark:hover:text-red-400"
          title="Delete deck"
        >
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div id="deck-facts">{{template "components/deck_facts" .}}</div>
</div>
