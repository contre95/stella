<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Authorize · Stella</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="/css/app.css" />
  <script>
    (function() {
      var t = localStorage.getItem("theme");
      if (t === "dark") document.documentElement.classList.add("dark");
      if (t === "eink") document.documentElement.classList.add("eink");
    })();
  </script>
</head>
<body class="h-full text-gray-800 antialiased dark:text-gray-100">
  <div class="app-bg"></div>
  <div class="flex h-full items-center justify-center p-4">
    <div class="glass w-full max-w-sm rounded-2xl p-6 sm:p-8">
      <h1 class="mb-1 text-lg font-bold tracking-tight text-gray-900 dark:text-white">Authorize {{.ClientName}}</h1>
      <p class="mb-6 text-sm text-gray-500 dark:text-gray-400">
        This will let <strong>{{.ClientName}}</strong> access your decks, cards, and review
        history in Stella{{if .Scope}} (scope: <code class="font-mono">{{.Scope}}</code>){{end}},
        using your account. You can revoke this at any time from Settings.
      </p>
      <form method="POST" action="/oauth/authorize" class="flex gap-3">
        <button type="submit" name="decision" value="deny" class="btn-ghost flex-1 rounded-xl px-4 py-2 text-sm font-medium">
          Deny
        </button>
        <button type="submit" name="decision" value="approve" class="btn-primary flex-1 rounded-xl px-4 py-2 text-sm font-medium">
          Approve
        </button>
      </form>
    </div>
  </div>
</body>
</html>
