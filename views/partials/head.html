<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#f7f2fb" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#07070b" media="(prefers-color-scheme: dark)" />
  <title>{{if .Title}}{{.Title}} · {{end}}Stella</title>
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png" />
  <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: ["Inter", "Noto Sans JP", "ui-sans-serif", "system-ui", "-apple-system", "Segoe UI", "Roboto", "sans-serif"],
          },
          colors: {
            pink: {
              50:  "#fdf2f8",
              100: "#fce7f3",
              200: "#fbcfe8",
              300: "#f9a8d4",
              400: "#f472b6",
              500: "#ec4899",
              600: "#db2777",
              700: "#be185d",
              800: "#9d174d",
              900: "#831843",
              950: "#500724",
            }
          }
        }
      }
    };
  </script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://unpkg.com/hyperscript.org@0.9.12"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    *, *::before, *::after { -webkit-tap-highlight-color: transparent; }
    html { touch-action: manipulation; }
    body {
      overscroll-behavior-y: contain;
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      -webkit-font-smoothing: antialiased;
    }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }

    /* ── Rendered fact markdown ─────────────────────────────────── */
    /* Sizes in em so headings scale with the card's base text size.
       Tailwind preflight zeroes heading sizes and list markers — restore them. */
    .md-content { overflow-wrap: break-word; }
    .md-content > * + * { margin-top: 0.5em; }
    .md-content h1 { font-size: 1.5em; font-weight: 800; line-height: 1.2; letter-spacing: -0.01em; }
    .md-content h2 { font-size: 1.25em; font-weight: 700; line-height: 1.25; }
    .md-content h3 { font-size: 1.1em; font-weight: 700; }
    .md-content h4, .md-content h5, .md-content h6 { font-weight: 700; }
    .md-content ul { list-style: disc; }
    .md-content ol { list-style: decimal; }
    .md-content ul, .md-content ol {
      display: inline-block; /* keeps the list block hugging its content when centered */
      padding-left: 1.4em;
      text-align: left;
    }
    .md-content li + li { margin-top: 0.2em; }
    .md-content code {
      font-size: 0.85em;
      padding: 0.1em 0.35em;
      border-radius: 0.35em;
      background: rgba(236, 72, 153, 0.12);
    }
    .md-content pre {
      text-align: left;
      overflow-x: auto;
      padding: 0.6em 0.8em;
      border-radius: 0.6em;
      font-size: 0.85em;
      background: rgba(17, 24, 39, 0.06);
    }
    .dark .md-content pre { background: rgba(255, 255, 255, 0.08); }
    .md-content pre code { padding: 0; background: none; }
    .md-content blockquote {
      display: inline-block;
      border-left: 3px solid rgba(236, 72, 153, 0.45);
      padding-left: 0.75em;
      text-align: left;
      opacity: 0.85;
    }
    .md-content a { text-decoration: underline; text-underline-offset: 2px; }
    .md-content hr { border-top: 1px solid rgba(107, 114, 128, 0.35); }
    /* Furigana: the reading (<rt>) rides above the kanji. It inherits the
       surrounding text colour by default; wrap it in {#hex}…{/} to colour a
       specific reading. margin-bottom nudges it 2px clear of the kanji below. */
    .md-content ruby rt { margin-bottom: 2px; }
    .eink .md-content code { background: rgba(0, 0, 0, 0.08); }
    .eink .md-content pre { background: rgba(0, 0, 0, 0.05); }
    .eink .md-content blockquote { border-left-color: #1a1a1a; }

    /* ── Fixed gradient backdrop that the glass surfaces sample ── */
    .app-bg {
      position: fixed;
      inset: 0;
      z-index: -10;
      background-color: #d6cce6;
      background-image:
        radial-gradient(46rem 46rem at 12% -8%, rgba(236, 72, 153, 0.18), transparent 60%),
        radial-gradient(42rem 42rem at 100% 2%, rgba(139, 92, 246, 0.14), transparent 55%),
        radial-gradient(40rem 40rem at 50% 120%, rgba(244, 114, 182, 0.14), transparent 60%);
    }
    .dark .app-bg {
      background-color: #000000;
      background-image:
        radial-gradient(46rem 46rem at 12% -8%, rgba(236, 72, 153, 0.12), transparent 60%),
        radial-gradient(42rem 42rem at 100% 2%, rgba(124, 58, 237, 0.16), transparent 55%),
        radial-gradient(40rem 40rem at 50% 120%, rgba(219, 39, 119, 0.10), transparent 60%);
    }

    /* ── Glass surfaces ─────────────────────────────────────────── */
    .glass {
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 8px 32px rgba(24, 16, 48, 0.08);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
    }
    .dark .glass {
      background: rgba(255, 255, 255, 0.045);
      border-color: rgba(255, 255, 255, 0.09);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    }

    /* More opaque glass for surfaces that carry a lot of text */
    .glass-strong {
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 16px 48px rgba(24, 16, 48, 0.14);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
    }
    .dark .glass-strong {
      background: rgba(23, 22, 30, 0.78);
      border-color: rgba(255, 255, 255, 0.1);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55);
    }

    /* Nav chrome — sidebar, top bar, mobile bar */
    .glass-nav {
      background: rgba(255, 255, 255, 0.6);
      border-color: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
    }
    .dark .glass-nav {
      background: rgba(11, 11, 16, 0.62);
      border-color: rgba(255, 255, 255, 0.07);
    }

    /* ── Inputs ─────────────────────────────────────────────────── */
    .glass-input {
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(17, 24, 39, 0.1);
      color: #111827;
      transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .glass-input::placeholder { color: rgba(107, 114, 128, 0.75); }
    .dark .glass-input {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.1);
      color: #f3f4f6;
    }
    .dark .glass-input::placeholder { color: rgba(156, 163, 175, 0.5); }
    input.glass-input:focus,
    select.glass-input:focus,
    textarea.glass-input:focus {
      outline: none;
      border-color: #ec4899;
      box-shadow: 0 0 0 4px rgba(236, 72, 153, 0.16);
    }

    /* ── Buttons ────────────────────────────────────────────────── */
    .btn-primary {
      background-image: linear-gradient(135deg, #f472b6 0%, #db2777 55%, #be185d 100%);
      color: #fff;
      box-shadow: 0 10px 24px -8px rgba(219, 39, 119, 0.6);
      transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
    }
    .btn-primary:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
      box-shadow: 0 14px 30px -8px rgba(219, 39, 119, 0.7);
    }
    .btn-primary:active { transform: translateY(0); filter: brightness(0.98); }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(17, 24, 39, 0.1);
      color: #374151;
      transition: background .15s ease, transform .15s ease, border-color .15s ease;
    }
    .btn-ghost:hover { background: rgba(255, 255, 255, 0.85); transform: translateY(-1px); }
    .dark .btn-ghost {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.12);
      color: #e5e7eb;
    }
    .dark .btn-ghost:hover { background: rgba(255, 255, 255, 0.1); }

    /* ── Swipeable rows ────────────────────────────────────────── */
    .swipe-row { position: relative; overflow: hidden; }
    .swipe-actions { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; z-index: 0; }
    .swipe-actions.left { left: 0; }
    .swipe-actions.right { right: 0; }
    .swipe-content { position: relative; z-index: 1; transition: transform 0.2s ease; background: inherit; }
    .swipe-btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 72px; height: 100%; padding: 0 12px;
      font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
      border: none; cursor: pointer;
    }
    .swipe-btn-del { background: #ef4444; color: #fff; }
    .swipe-btn-reset { background: #f59e0b; color: #fff; }

    /* ── Card audio player buttons ─────────────────────────────── */
    /* Round chip: inner disc matches the opaque card face; outer ring doubles as progress */
    .audio-chip {
      --p: 0%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.25rem;
      height: 2.25rem;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      color: #db2777;
      background:
        radial-gradient(closest-side, #fdfcff 74%, transparent 75% 100%),
        conic-gradient(#ec4899 var(--p), rgba(236, 72, 153, 0.22) var(--p));
      transition: transform 0.15s ease;
    }
    .dark .audio-chip {
      color: #f472b6;
      background:
        radial-gradient(closest-side, #191822 74%, transparent 75% 100%),
        conic-gradient(#f472b6 var(--p), rgba(244, 114, 182, 0.22) var(--p));
    }
    .audio-chip:hover { transform: scale(1.08); }
    .audio-chip svg { width: 0.85rem; height: 0.85rem; }
    .audio-chip .ac-play { margin-left: 2px; }
    .audio-chip .ac-pause { display: none; }
    .audio-chip.playing .ac-play { display: none; }
    .audio-chip.playing .ac-pause { display: block; margin-left: 0; }

    /* Read-aloud button: sits inline in running text at whatever font size
       .md-content happens to render at, so it's sized in em rather than the
       fixed rem sizes above. */
    .tts-wrap { display: inline; }
    .tts-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1em;
      height: 1em;
      margin: 0 0.15em;
      vertical-align: -0.1em;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      padding: 0;
      background: transparent;
      color: #db2777;
      transition: transform 0.15s ease;
    }
    .dark .tts-btn { color: #f472b6; }
    .tts-btn:hover { transform: scale(1.15); }
    .tts-btn svg { width: 0.85em; height: 0.85em; }
    .tts-btn .tts-icon-stop { display: none; }
    .tts-btn.speaking .tts-icon-speak { display: none; }
    .tts-btn.speaking .tts-icon-stop { display: block; }
    .tts-btn.speaking { color: #ec4899; animation: tts-pulse 1s ease-in-out infinite; }
    .dark .tts-btn.speaking { color: #f9a8d4; }
    @keyframes tts-pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.5; }
    }

    /* Inline pill for list rows: left-to-right tint fill doubles as progress */
    .audio-pill {
      --p: 0%;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.3rem 0.7rem;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      color: #db2777;
      background-image: linear-gradient(90deg, rgba(236, 72, 153, 0.22) var(--p), rgba(236, 72, 153, 0.09) var(--p));
      box-shadow: inset 0 0 0 1px rgba(236, 72, 153, 0.28);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .audio-pill:hover { transform: translateY(-1px); box-shadow: inset 0 0 0 1px rgba(236, 72, 153, 0.5); }
    .dark .audio-pill {
      color: #f472b6;
      background-image: linear-gradient(90deg, rgba(244, 114, 182, 0.24) var(--p), rgba(244, 114, 182, 0.10) var(--p));
      box-shadow: inset 0 0 0 1px rgba(244, 114, 182, 0.3);
    }
    .dark .audio-pill:hover { box-shadow: inset 0 0 0 1px rgba(244, 114, 182, 0.55); }
    .audio-pill svg { width: 0.7rem; height: 0.7rem; flex-shrink: 0; }
    .audio-pill .ac-pause { display: none; }
    .audio-pill.playing .ac-play { display: none; }
    .audio-pill.playing .ac-pause { display: block; }
    .ap-eq { display: inline-flex; align-items: center; gap: 2.5px; height: 0.85rem; }
    .ap-eq i {
      width: 2.5px;
      border-radius: 2px;
      background: currentColor;
      animation: ap-eq 1s ease-in-out infinite;
      animation-play-state: paused; /* frozen bars read as a static waveform */
    }
    .ap-eq i:nth-child(1) { height: 35%; animation-delay: -0.30s; }
    .ap-eq i:nth-child(2) { height: 90%; animation-delay: -0.15s; }
    .ap-eq i:nth-child(3) { height: 55%; animation-delay: -0.45s; }
    .ap-eq i:nth-child(4) { height: 75%; animation-delay: -0.60s; }
    .audio-pill.playing .ap-eq i { animation-play-state: running; }
    @keyframes ap-eq {
      0%, 100% { transform: scaleY(0.5); }
      50%      { transform: scaleY(1.2); }
    }
    /* Review-card player: glass capsule with gradient play button, glow track, live EQ */
    .review-player {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.45rem 1rem 0.45rem 0.45rem;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.65);
      box-shadow: 0 10px 30px -12px rgba(219, 39, 119, 0.35);
      backdrop-filter: blur(16px) saturate(160%);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      transition: box-shadow 0.2s ease;
    }
    .dark .review-player {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.5);
    }
    .review-player.playing {
      box-shadow: 0 10px 34px -10px rgba(219, 39, 119, 0.55), inset 0 0 0 1px rgba(236, 72, 153, 0.25);
    }
    .rp-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 2.75rem;
      height: 2.75rem;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, #f472b6 0%, #db2777 55%, #be185d 100%);
      box-shadow: 0 6px 16px -4px rgba(219, 39, 119, 0.55);
      transition: transform 0.15s ease;
    }
    .rp-btn:hover { transform: scale(1.06); }
    .rp-btn:active { transform: scale(0.94); }
    .review-player.playing .rp-btn::after {
      content: '';
      position: absolute;
      inset: -5px;
      border-radius: 9999px;
      border: 2px solid rgba(236, 72, 153, 0.45);
      animation: rp-pulse 1.8s ease-out infinite;
    }
    @keyframes rp-pulse {
      0%   { transform: scale(0.85); opacity: 0.9; }
      70%  { transform: scale(1.18); opacity: 0; }
      100% { transform: scale(1.18); opacity: 0; }
    }
    .rp-track {
      height: 0.5rem;
      border-radius: 9999px;
      overflow: hidden;
      cursor: pointer;
      background: rgba(17, 24, 39, 0.08);
    }
    .dark .rp-track { background: rgba(255, 255, 255, 0.12); }
    .rp-fill {
      height: 100%;
      border-radius: 9999px;
      pointer-events: none;
      background: linear-gradient(90deg, #f9a8d4, #ec4899 60%, #db2777);
      box-shadow: 0 0 10px rgba(236, 72, 153, 0.55);
      transition: width 0.1s linear;
    }
    .rp-time {
      font-size: 0.7rem;
      font-weight: 600;
      color: #9ca3af;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }
    .dark .rp-time { color: #6b7280; }
    .rp-eq {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      height: 0.8rem;
      color: #db2777;
    }
    .dark .rp-eq { color: #f472b6; }
    .rp-eq i {
      width: 3px;
      border-radius: 2px;
      background: currentColor;
      opacity: 0.9;
      animation: ap-eq 1s ease-in-out infinite;
      animation-play-state: paused; /* frozen bars read as a static waveform */
    }
    .rp-eq i:nth-child(1) { height: 40%;  animation-delay: -0.30s; }
    .rp-eq i:nth-child(2) { height: 85%;  animation-delay: -0.15s; }
    .rp-eq i:nth-child(3) { height: 60%;  animation-delay: -0.45s; }
    .rp-eq i:nth-child(4) { height: 100%; animation-delay: -0.60s; }
    .rp-eq i:nth-child(5) { height: 50%;  animation-delay: -0.75s; }
    .review-player.playing .rp-eq i { animation-play-state: running; }

    @media (prefers-reduced-motion: reduce) {
      .audio-chip, .audio-pill, .rp-btn { transition: none; }
      .ap-eq i, .rp-eq i { animation: none; }
      .review-player.playing .rp-btn::after { animation: none; opacity: 0.5; }
    }

    /* ── Teleprompter badge ────────────────────────────────────── */
    .deck-badge {
      overflow: hidden; white-space: nowrap; display: inline-block; max-width: 100%;
      vertical-align: middle;
    }
    .deck-badge-inner {
      display: inline-block; padding-right: 0;
    }
    .deck-badge:hover .deck-badge-inner,
    .deck-badge:focus .deck-badge-inner {
      animation: tp-scroll 2.5s linear infinite;
    }
    @keyframes tp-scroll {
      0%   { transform: translateX(0); }
      40%  { transform: translateX(calc(-100% + 10ch)); }
      60%  { transform: translateX(calc(-100% + 10ch)); }
      100% { transform: translateX(0); }
    }

    .lift { transition: transform .18s ease, box-shadow .18s ease; }
    .lift:hover { transform: translateY(-3px); }

    .text-gradient {
      background: linear-gradient(120deg, #f472b6, #db2777);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    /* Thin, unobtrusive scrollbars */
    * { scrollbar-width: thin; scrollbar-color: rgba(219, 39, 119, 0.35) transparent; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(219, 39, 119, 0.3); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(219, 39, 119, 0.5); }

    /* ── Nav active state ───────────────────────────────────────── */
    aside .nav-link.nav-active {
      background-image: linear-gradient(to right, rgba(236,72,153,.15), rgba(236,72,153,.05));
      color: #be185d;
      box-shadow: inset 0 0 0 1px rgba(236,72,153,.2);
      font-weight: 600;
    }
    .dark aside .nav-link.nav-active {
      background-image: linear-gradient(to right, rgba(236,72,153,.20), rgba(236,72,153,.05));
      color: #f9a8d4;
      box-shadow: inset 0 0 0 1px rgba(244,114,182,.2);
    }
    nav .nav-link.nav-active { color: #db2777; font-weight: 600; }
    .dark nav .nav-link.nav-active { color: #f472b6; }

    /* ── Nav icons ──────────────────────────────────────────────── */
    /* Full-color illustrated icons: muted while idle, colorful on hover/active */
    .nav-icon {
      filter: grayscale(1) opacity(0.55);
      transition: filter .2s ease, transform .2s ease;
    }
    .dark .nav-icon { filter: grayscale(1) invert(0.15) opacity(0.6); }
    .nav-link:hover .nav-icon { filter: none; }
    .nav-link.nav-active .nav-icon {
      filter: drop-shadow(0 1px 3px rgba(236, 72, 153, 0.4));
      transform: scale(1.12);
    }

    /* ── Mobile bottom-nav clearance ───────────────────────────── */
    @media (max-width: 1023px) {
      #contenido { padding-bottom: 7rem; }
    }

    /* ── Immersive review ──────────────────────────────────────────
       While a review card is on screen, hide the mobile bottom nav and
       drop its bottom clearance. This keeps the card the same height
       whether or not the sidebar is showing, so it doesn't shrink at the
       lg breakpoint where the sidebar collapses into the mobile nav. */
    body:has(#review-card-wrap) #mobile-nav { display: none; }
    @media (max-width: 1023px) {
      body:has(#review-card-wrap) #contenido { padding-bottom: 0; }
    }

    /* ── SweetAlert2 glass theme ──────────────────────────────── */
    .swal2-container { backdrop-filter: blur(6px) !important; -webkit-backdrop-filter: blur(6px) !important; }
    .swal2-popup {
      font-family: "Inter", ui-sans-serif, system-ui, sans-serif !important;
      background: rgba(255,255,255,0.88) !important;
      border: 1px solid rgba(255,255,255,0.72) !important;
      box-shadow: 0 24px 64px rgba(24,16,48,0.18) !important;
      backdrop-filter: blur(28px) saturate(160%) !important;
      -webkit-backdrop-filter: blur(28px) saturate(160%) !important;
      border-radius: 1.25rem !important;
      padding: 2rem !important;
    }
