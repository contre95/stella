<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#f7f2fb" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#07070b" media="(prefers-color-scheme: dark)" />
  <title>{{if .Title}}{{.Title}} · {{end}}Stella</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/stella.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: ["Inter", "ui-sans-serif", "system-ui", "-apple-system", "Segoe UI", "Roboto", "sans-serif"],
          },
          colors: {
            pink: {
              50:  "#fdf2f8",
              100: "#fce7f3",
              200: "#fbcfe8",
              300: "#f9a8d4",
              400: "#f472b6",
              500: "#ec4899",
              600: "#db2777",
              700: "#be185d",
              800: "#9d174d",
              900: "#831843",
              950: "#500724",
            }
          }
        }
      }
    };
  </script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://unpkg.com/hyperscript.org@0.9.12"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    *, *::before, *::after { -webkit-tap-highlight-color: transparent; }
    html { touch-action: manipulation; }
    body {
      overscroll-behavior-y: contain;
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      -webkit-font-smoothing: antialiased;
    }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }

    /* ── Fixed gradient backdrop that the glass surfaces sample ── */
    .app-bg {
      position: fixed;
      inset: 0;
      z-index: -10;
      background-color: #f4f1fb;
      background-image:
        radial-gradient(46rem 46rem at 12% -8%, rgba(236, 72, 153, 0.22), transparent 60%),
        radial-gradient(42rem 42rem at 100% 2%, rgba(139, 92, 246, 0.18), transparent 55%),
        radial-gradient(40rem 40rem at 50% 120%, rgba(244, 114, 182, 0.18), transparent 60%);
    }
    .dark .app-bg {
      background-color: #07070b;
      background-image:
        radial-gradient(46rem 46rem at 12% -8%, rgba(236, 72, 153, 0.16), transparent 60%),
        radial-gradient(42rem 42rem at 100% 2%, rgba(124, 58, 237, 0.20), transparent 55%),
        radial-gradient(40rem 40rem at 50% 120%, rgba(219, 39, 119, 0.14), transparent 60%);
    }

    /* ── Glass surfaces ─────────────────────────────────────────── */
    .glass {
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 8px 32px rgba(24, 16, 48, 0.08);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
    }
    .dark .glass {
      background: rgba(255, 255, 255, 0.045);
      border-color: rgba(255, 255, 255, 0.09);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    }

    /* More opaque glass for surfaces that carry a lot of text */
    .glass-strong {
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 16px 48px rgba(24, 16, 48, 0.14);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
    }
    .dark .glass-strong {
      background: rgba(23, 22, 30, 0.78);
      border-color: rgba(255, 255, 255, 0.1);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55);
    }

    /* Nav chrome — sidebar, top bar, mobile bar */
    .glass-nav {
      background: rgba(255, 255, 255, 0.6);
      border-color: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
    }
    .dark .glass-nav {
      background: rgba(11, 11, 16, 0.62);
      border-color: rgba(255, 255, 255, 0.07);
    }

    /* ── Inputs ─────────────────────────────────────────────────── */
    .glass-input {
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(17, 24, 39, 0.1);
      color: #111827;
      transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .glass-input::placeholder { color: rgba(107, 114, 128, 0.75); }
    .dark .glass-input {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.1);
      color: #f3f4f6;
    }
    .dark .glass-input::placeholder { color: rgba(156, 163, 175, 0.5); }
    input.glass-input:focus,
    select.glass-input:focus,
    textarea.glass-input:focus {
      outline: none;
      border-color: #ec4899;
      box-shadow: 0 0 0 4px rgba(236, 72, 153, 0.16);
    }

    /* ── Buttons ────────────────────────────────────────────────── */
    .btn-primary {
      background-image: linear-gradient(135deg, #f472b6 0%, #db2777 55%, #be185d 100%);
      color: #fff;
      box-shadow: 0 10px 24px -8px rgba(219, 39, 119, 0.6);
      transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
    }
    .btn-primary:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
      box-shadow: 0 14px 30px -8px rgba(219, 39, 119, 0.7);
    }
    .btn-primary:active { transform: translateY(0); filter: brightness(0.98); }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(17, 24, 39, 0.1);
      color: #374151;
      transition: background .15s ease, transform .15s ease, border-color .15s ease;
    }
    .btn-ghost:hover { background: rgba(255, 255, 255, 0.85); transform: translateY(-1px); }
    .dark .btn-ghost {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.12);
      color: #e5e7eb;
    }
    .dark .btn-ghost:hover { background: rgba(255, 255, 255, 0.1); }

    /* ── Micro-interactions & accents ───────────────────────────── */
    .lift { transition: transform .18s ease, box-shadow .18s ease; }
    .lift:hover { transform: translateY(-3px); }

    .text-gradient {
      background: linear-gradient(120deg, #f472b6, #db2777);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    /* Thin, unobtrusive scrollbars */
    * { scrollbar-width: thin; scrollbar-color: rgba(219, 39, 119, 0.35) transparent; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(219, 39, 119, 0.3); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(219, 39, 119, 0.5); }
  </style>
  <script>
    if (localStorage.getItem("theme") === "dark") {
      document.documentElement.classList.add("dark");
    }
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
    }
  </script>
</head>
