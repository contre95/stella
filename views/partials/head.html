<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#f7f2fb" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#07070b" media="(prefers-color-scheme: dark)" />
  <title>{{if .Title}}{{.Title}} · {{end}}Stella</title>
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png" />
  <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://unpkg.com/hyperscript.org@0.9.12"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <link rel="stylesheet" href="/css/app.css" />
  <script>
    (function() {
      var t = localStorage.getItem("theme");
      if (t === "dark") document.documentElement.classList.add("dark");
      if (t === "eink") document.documentElement.classList.add("eink");
    })();
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
    }
  </script>
  <script>
    // Shared play/pause/scrub widget for card audio (review card + preview
    // modal). Defined here (rather than partials/scripts.html) because it
    // must exist before those inline <script> blocks run on a full page load —
    // scripts.html loads at the end of <body>, after they do.
    //
    // Element ids follow the pattern `<idPrefix>play-btn-<suffix>`,
    // `<idPrefix>track-<suffix>`, `<idPrefix>fill-<suffix>`,
    // `<idPrefix>cur-<suffix>`, `<idPrefix>dur-<suffix>`,
    // `<idPrefix>player-<suffix>` (the wrapper).
    (function () {
      var PLAY_ICON  = '<svg viewBox="0 0 10 10" fill="currentColor" style="width:15px;height:15px;margin-left:2px"><path d="M2 1.5v7l6-3.5z"/></svg>';
      var PAUSE_ICON = '<svg viewBox="0 0 10 10" fill="currentColor" style="width:15px;height:15px"><rect x="1.5" y="1" width="2.5" height="8" rx="0.8"/><rect x="6" y="1" width="2.5" height="8" rx="0.8"/></svg>';

      window.stellaInitAudioPlayer = function (audioEl, idPrefix, suffix, opts) {
        opts = opts || {};
        var btn     = document.getElementById(idPrefix + 'play-btn-' + suffix);
        var track   = document.getElementById(idPrefix + 'track-' + suffix);
        var fill    = document.getElementById(idPrefix + 'fill-' + suffix);
        var cur     = document.getElementById(idPrefix + 'cur-' + suffix);
        var dur     = document.getElementById(idPrefix + 'dur-' + suffix);
        var wrapper = document.getElementById(idPrefix + 'player-' + suffix);
        if (!btn || !track) return;

        if (opts.stopTouchPropagation) {
          wrapper.addEventListener('touchstart', function (e) { e.stopPropagation(); }, { passive: true });
          wrapper.addEventListener('touchend', function (e) { e.stopPropagation(); });
        }

        function fmt(s) {
          if (!isFinite(s) || isNaN(s)) return '-:--';
          var m = Math.floor(s / 60), sec = Math.floor(s % 60);
          return m + ':' + (sec < 10 ? '0' : '') + sec;
        }
        function sync() {
          var pct = audioEl.duration ? (audioEl.currentTime / audioEl.duration) * 100 : 0;
          fill.style.width = pct + '%';
          if (cur) cur.textContent = fmt(audioEl.currentTime);
          if (dur) dur.textContent = fmt(audioEl.duration);
          btn.innerHTML = audioEl.paused ? PLAY_ICON : PAUSE_ICON;
          wrapper.classList.toggle('playing', !audioEl.paused);
        }

        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          if (audioEl.paused) audioEl.play().catch(function () {});
          else audioEl.pause();
        });
        track.addEventListener('click', function (e) {
          e.stopPropagation();
          if (!audioEl.duration) return;
          var rect = track.getBoundingClientRect();
          audioEl.currentTime = ((e.clientX - rect.left) / rect.width) * audioEl.duration;
        });
        audioEl.addEventListener('timeupdate', sync);
        audioEl.addEventListener('durationchange', sync);
        audioEl.addEventListener('play', sync);
        audioEl.addEventListener('pause', sync);
        audioEl.addEventListener('ended', function () { audioEl.currentTime = 0; sync(); });
        sync();
      };
    })();
  </script>
  <script>
    // Fits a card face's text to the space actually available for it,
    // instead of a fixed/viewport-driven size: only genuinely short content
    // (a single kanji/word — <=3 chars, matching the old fixed-size rule
    // this replaced) grows past the fluid base size (see .katex-math's
    // sibling rule in input.css); everything else is capped at that base
    // size and only shrinks, until it stops needing to scroll or hits the
    // floor, in which case it scrolls (see .face-fade in input.css for the
    // blur that keeps that legible). Without this cap, any content short
    // enough to fit a tall card at a big size — not just single-word
    // cards — got stretched toward MAX_PX and looked oversized.
    window.stellaFitCardText = function (scrollEl, contentEl) {
      if (!scrollEl || !contentEl) return;
      contentEl.style.fontSize = '';
      var base = parseFloat(getComputedStyle(contentEl).fontSize) || 16;
      var isShort = contentEl.textContent.trim().length <= 3;
      var MAX_PX = 48; // hard cap — never grow past this, however short the content
      var lo = 14, hi = isShort ? Math.min(base * 2, MAX_PX) : base;

      function fits(px) {
        contentEl.style.fontSize = px + 'px';
        return scrollEl.scrollHeight <= scrollEl.clientHeight + 1;
      }

      if (fits(hi)) { contentEl.style.fontSize = hi + 'px'; return; }
      if (!fits(lo)) { contentEl.style.fontSize = lo + 'px'; return; }
      for (var i = 0; i < 8; i++) {
        var mid = (lo + hi) / 2;
        if (fits(mid)) lo = mid; else hi = mid;
      }
      contentEl.style.fontSize = lo + 'px';
    };
  </script>
</head>
