<header class="glass-nav flex items-center justify-between border-b px-4 py-3 sm:px-6">
  <!-- Mobile brand -->
  <div class="flex items-center gap-2 sm:hidden">
    <img src="/logo.png" alt="Stella" class="h-12 w-12 rounded-lg object-contain" />
    <span class="text-xl font-bold bg-gradient-to-r from-pink-400 to-pink-600 bg-clip-text text-transparent">Stella</span>
  </div>

  <div class="ml-auto flex items-center gap-2">
    <button
      type="button"
      _="on click
           toggle .dark on document.documentElement
           then if document.documentElement.classList.contains('dark')
             call localStorage.setItem('theme', 'dark')
           else
             call localStorage.setItem('theme', 'light')
           end"
      class="btn-ghost inline-flex items-center gap-1.5 rounded-xl px-3 py-1.5 text-xs font-medium"
    >
      <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
      </svg>
      Theme
    </button>
  </div>
</header>
