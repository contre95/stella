<header
  class="flex items-center justify-between border-b border-gray-200 bg-white px-6 py-3 dark:border-gray-800 dark:bg-gray-950"
>
  <div class="flex items-center gap-2 sm:hidden">
    <span class="text-xl">✦</span>
    <span class="text-lg font-bold">Stella</span>
  </div>
  <div class="ml-auto flex items-center gap-3">
    <button
      type="button"
      _="on click
           toggle .dark on document.documentElement
           then if document.documentElement.classList.contains('dark')
             call localStorage.setItem('theme', 'dark')
           else
             call localStorage.setItem('theme', 'light')
           end"
      class="rounded-lg border border-gray-200 px-3 py-1.5 text-sm font-medium text-gray-700 hover:bg-gray-100 dark:border-gray-700 dark:text-gray-200 dark:hover:bg-gray-800"
    >
      🌓 Theme
    </button>
  </div>
</header>
