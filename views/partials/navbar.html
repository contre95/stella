<header class="glass-nav flex items-center justify-between border-b px-4 py-3 sm:px-6">
  <!-- Mobile brand -->
  <div class="flex items-center gap-2 lg:hidden">
    <img src="/logo.png" alt="Stella" class="h-12 w-12 rounded-lg object-contain" />
    <div>
      <span class="text-xl font-bold bg-gradient-to-r from-pink-400 to-pink-600 bg-clip-text text-transparent">Stella</span>
      <div hx-get="/sidebar-stats" hx-trigger="load" hx-target="this"></div>
    </div>
  </div>

  <div class="ml-auto flex items-center gap-2">
    <button
      type="button"
      _="on click
           if document.documentElement.classList.contains('dark')
             remove .dark from document.documentElement
             add .eink to document.documentElement
             call localStorage.setItem('theme', 'eink')
           else if document.documentElement.classList.contains('eink')
             remove .eink from document.documentElement
             call localStorage.setItem('theme', 'light')
           else
             add .dark to document.documentElement
             call localStorage.setItem('theme', 'dark')
           end"
      class="btn-ghost rounded-xl p-1.5"
      title="Toggle theme"
    >
      <!-- light mode → moon (go dark) -->
      <svg class="theme-icon-moon h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
      </svg>
      <!-- dark mode → document/page icon (go e-ink) -->
      <svg class="theme-icon-eink-indicator h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
      </svg>
      <!-- e-ink mode → sun (go light) -->
      <svg class="theme-icon-sun h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
      </svg>
    </button>
    {{if .MultiUser}}
    <div class="flex items-center gap-1.5 pl-2 ml-1 border-l border-gray-200 dark:border-white/10">
      <span class="max-w-40 truncate text-xs font-medium text-gray-600 dark:text-gray-300" title="{{.UserEmail}}">{{.UserName}}</span>
      <a
        href="/auth/logout"
        title="Sign out"
        class="btn-ghost rounded-xl p-1.5"
      >
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
      </a>
    </div>
    {{end}}
  </div>
</header>
