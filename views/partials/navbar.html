<header class="flex items-center justify-between border-b border-gray-200 bg-white px-4 py-3 dark:border-gray-800 dark:bg-[#111111] sm:px-6">
  <!-- Mobile brand -->
  <div class="flex items-center gap-2 sm:hidden">
    <span class="text-lg text-pink-600">✦</span>
    <span class="text-base font-bold text-gray-900 dark:text-white">Stella</span>
  </div>

  <div class="ml-auto flex items-center gap-2">
    <button
      type="button"
      _="on click
           toggle .dark on document.documentElement
           then if document.documentElement.classList.contains('dark')
             call localStorage.setItem('theme', 'dark')
           else
             call localStorage.setItem('theme', 'light')
           end"
      class="inline-flex items-center gap-1.5 rounded-lg border border-gray-200 bg-white px-3 py-1.5 text-xs font-medium text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition-colors dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700"
    >
      <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
      </svg>
      Theme
    </button>
  </div>
</header>
