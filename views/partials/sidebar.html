<aside class="glass-nav hidden w-60 shrink-0 flex-col border-r sm:flex">
  <!-- Logo -->
  <div class="flex items-center gap-2.5 px-5 py-5">
    <img src="/logo.png" alt="Stella" class="h-14 w-14 rounded-xl object-contain" />
    <div>
      <span class="text-2xl font-bold tracking-tight bg-gradient-to-r from-pink-400 to-pink-600 bg-clip-text text-transparent">Stella</span>
      <div hx-get="/sidebar-stats" hx-trigger="load" hx-target="this"></div>
    </div>
  </div>

  <!-- Nav -->
  <nav class="flex-1 px-3 py-4 space-y-1">
    <a
      href="/"
      hx-get="/"
      hx-target="#contenido"
      hx-swap="outerHTML"
      hx-push-url="true"
      _="on click remove .nav-active from .nav-link then add .nav-active to me"
      class="nav-link {{if eq .Section "dashboard"}}nav-active{{end}} flex items-center gap-2.5 rounded-xl px-3 py-2.5 text-sm font-medium text-gray-600 hover:bg-white/60 hover:text-gray-900 transition-colors dark:text-gray-400 dark:hover:bg-white/10 dark:hover:text-gray-100"
    >
      <img src="/icons/dash.svg" alt="" class="nav-icon h-5 w-5 shrink-0" />
      Dashboard
    </a>
    <a
      href="/review"
      hx-get="/review"
      hx-target="#contenido"
      hx-swap="outerHTML"
      hx-push-url="true"
      _="on click remove .nav-active from .nav-link then add .nav-active to me"
      class="nav-link {{if or (eq .Section "review") (eq .Section "review_done")}}nav-active{{end}} flex items-center gap-2.5 rounded-xl px-3 py-2.5 text-sm font-medium text-gray-600 hover:bg-white/60 hover:text-gray-900 transition-colors dark:text-gray-400 dark:hover:bg-white/10 dark:hover:text-gray-100"
    >
      <img src="/icons/study.svg" alt="" class="nav-icon h-5 w-5 shrink-0" />
      Study
    </a>
    <a
      href="/decks"
      hx-get="/decks"
      hx-target="#contenido"
      hx-swap="outerHTML"
      hx-push-url="true"
      _="on click remove .nav-active from .nav-link then add .nav-active to me"
      class="nav-link {{if eq .Section "decks"}}nav-active{{end}} flex items-center gap-2.5 rounded-xl px-3 py-2.5 text-sm font-medium text-gray-600 hover:bg-white/60 hover:text-gray-900 transition-colors dark:text-gray-400 dark:hover:bg-white/10 dark:hover:text-gray-100"
    >
      <img src="/icons/decks.svg" alt="" class="nav-icon h-5 w-5 shrink-0" />
      Decks
    </a>
    <a
      href="/cards"
      hx-get="/cards"
      hx-target="#contenido"
      hx-swap="outerHTML"
      hx-push-url="true"
      _="on click remove .nav-active from .nav-link then add .nav-active to me"
      class="nav-link {{if eq .Section "cards"}}nav-active{{end}} flex items-center gap-2.5 rounded-xl px-3 py-2.5 text-sm font-medium text-gray-600 hover:bg-white/60 hover:text-gray-900 transition-colors dark:text-gray-400 dark:hover:bg-white/10 dark:hover:text-gray-100"
    >
      <img src="/icons/cards.svg" alt="" class="nav-icon h-5 w-5 shrink-0" />
      Cards
    </a>
    <a
      href="/about"
      hx-get="/about"
      hx-target="#contenido"
      hx-swap="outerHTML"
      hx-push-url="true"
      _="on click remove .nav-active from .nav-link then add .nav-active to me"
      class="nav-link {{if eq .Section "about"}}nav-active{{end}} flex items-center gap-2.5 rounded-xl px-3 py-2.5 text-sm font-medium text-gray-600 hover:bg-white/60 hover:text-gray-900 transition-colors dark:text-gray-400 dark:hover:bg-white/10 dark:hover:text-gray-100"
    >
      <svg class="nav-icon h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      About
    </a>
  </nav>

  <div class="px-5 py-4 text-xs text-gray-400 dark:text-gray-500 text-center">{{ .Version }}</div>
</aside>

<script>
  function updateNavActive() {
    var path = window.location.pathname;
    document.querySelectorAll('.nav-link').forEach(function(el) {
      var href = el.getAttribute('href');
      var active = (href === '/' && path === '/') ||
                   (href !== '/' && (path === href || path.startsWith(href + '/')));
      el.classList.toggle('nav-active', active);
    });
  }
  document.addEventListener('htmx:afterSettle', updateNavActive);
  document.addEventListener('DOMContentLoaded', updateNavActive);
</script>
